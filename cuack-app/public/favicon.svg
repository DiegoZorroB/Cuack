<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Grupo principal con los estilos del trazo -->
  <g stroke="#B55CFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Cuello, Cabeza y Pico (Trazo continuo) -->
    <!-- M: Inicio del cuello | Q: Curva del cuello | A: Arco de la cabeza | L: Pico -->
    <path d="M 25 75 
             Q 33 65 35 60 
             A 22 22 0 1 1 72 42 
             L 82 48 
             L 70 53 
             A 22 22 0 0 1 38 62" />
             
    <!-- Curva inferior flotante -->
    <path d="M 32 82 Q 50 78 62 82" />
  </g>
  
  <!-- Ojo (Círculo relleno) -->
  <circle cx="58" cy="38" r="3.5" fill="#B55CFF" />
</svg>